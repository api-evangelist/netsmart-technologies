name: Netsmart Technologies
description: 'Netsmart Technologies is a healthcare software and services company serving
  community-based care providers across human services, post-acute care, home care and
  hospice, public sector, and physical rehabilitation. Its CareFabric platform unifies
  electronic health records (EHR) such as CareRecord, myAvatar, and myUnity with workforce
  management, revenue cycle, analytics, and interoperability tooling. Netsmart is a founding
  member of the Carequality interoperability collaborative and became the first EHR built for
  human services and post-acute care to be designated a Qualified Health Information Network
  (QHIN) under TEFCA, exchanging clinical data via FHIR-based standards. The company publishes
  no public developer portal or API documentation; integration is delivered through its
  CareConnect interoperability services, the Netsmart Marketplace partner program, and direct
  engagement rather than a self-service public API.'
